[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
ffi = false
# Tests read three things besides their own code: the fixtures, the documents (the launch tests hold
# `docs/LAUNCH.md` and `README.md` against the code) and the ABIs the compiler wrote (to check the
# lists of entry points). Nothing is written.
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read", path = "./docs" },
    { access = "read", path = "./README.md" },
    { access = "read", path = "./out" },
]
# Fork tests live in `test/fork` and need a mainnet RPC; the default run leaves them out so the
# suite passes with no network. Run them with `FOUNDRY_PROFILE=fork forge test`.
no_match_path = "test/fork/**"

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 48
fail_on_revert = false

# The fork profile changes only which tests run: the compiler settings are the default profile's.
[profile.fork]
match_path = "test/fork/**"
no_match_path = "test/none/**"

[rpc_endpoints]
mainnet = "https://ethereum-rpc.publicnode.com"

[fmt]
line_length = 120
